
<div class="password-page">

  <div class="floating-heart heart-one">♡</div>
  <div class="floating-heart heart-two">♡</div>
  <div class="floating-heart heart-three">♥</div>

  <div class="password-card">

    <div class="main-heart">♡</div>

    <span class="eyebrow">
      SOMETHING SPECIAL AWAITS
    </span>

    <h1>
      Just for you,<br />
      <span>Baby.</span>
    </h1>

    <p class="description">
      My love, I've made something special for you.
      But first, you'll need our little secret to unlock it.
    </p>

    <form
      #passwordForm
      (submit)="
        $event.preventDefault();
        unlock(passwordInput.value)
      "
    >

      <input
        #passwordInput
        type="password"
        placeholder="Enter our little secret..."
        autocomplete="off"
        [disabled]="isChecking"
      />

      <button
        type="submit"
        [disabled]="isChecking"
      >
        {{ isChecking ? 'Unlocking...' : 'Unlock my surprise ♡' }}
      </button>

    </form>

    <div class="error-message" aria-live="polite">
      {{ errorMessage }}
    </div>

    <div class="footer-message">
      A little piece of my heart, just for you.
    </div>

  </div>

</div>
